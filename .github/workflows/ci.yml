name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - name: Typecheck the sample
        # The sample imports @nestjs/ai by its name, which resolves to this package's build.
        run: npx tsc -p sample/tsconfig.json --noEmit

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Node.js lines `ai` 7 runs on, against the oldest supported NestJS release (12.0)
        # and the latest 12.x. @nestjs/platform-node exists from 12.3 on, so its specs are
        # skipped on 12.0.
        node-version: [22, 24]
        nestjs-version: ['12.0', '12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install NestJS ${{ matrix.nestjs-version }}
        run: npm install --no-save @nestjs/common@${{ matrix.nestjs-version }} @nestjs/core@${{ matrix.nestjs-version }} @nestjs/testing@${{ matrix.nestjs-version }} @nestjs/platform-express@${{ matrix.nestjs-version }} @nestjs/platform-fastify@${{ matrix.nestjs-version }}
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: e2e tests
        run: npm run test:e2e

  ai-minimum:
    # The oldest `ai` release the peer range admits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install ai 7.0.0
        run: npm install --no-save ai@7.0.0
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: e2e tests
        run: npm run test:e2e

  siblings-latest:
    # The latest releases of the sibling packages that are peers, which the peer ranges accept up to their 1.0.
    # @nestjs/mcp is not a peer: the tests that stack @Tool() and @AgentFunction() use the locked one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install the latest @nestjs/resilience and @nestjs/workflows
        run: npm install --no-save @nestjs/resilience@latest @nestjs/workflows@latest
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: e2e tests
        run: npm run test:e2e
